# Project-wide Gradle settings.

# Enable AndroidX and Jetifier
android.useAndroidX=true

# Enables namespaced R classes so that each library's R class contains only its own resources.
android.nonTransitiveRClass=true

# JVM memory configuration for Gradle build daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style
kotlin.code.style=official

# Enable configuration cache and parallel builds for faster CI execution
org.gradle.parallel=true
org.gradle.caching=true
